name: 🚀 Build and Deploy Supportly AI Next.js Frontend

on:
  push:
    branches:
      - Development
      - development

env:
  IMAGE_NAME: yedii/supportly-ai-frontend

jobs:
  build-and-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: SupportlyAI

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📝 Setup Environment File
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env.production
            echo "${{ secrets.ENV_FILE }}" > .env.Development
          elif [ -f .env.Development ]; then
            cp .env.Development .env.production
          elif [ -f .env ]; then
            cp .env .env.production
          else
            echo "PORT=9005" > .env.production
            echo "PORT=9005" > .env.Development
          fi

      - name: 🏗️ Build Next.js App
        run: npm run build

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: SupportlyAI

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: 📁 Create App Directory on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/supportly-ai"

      - name: 📤 Copy docker-compose.yml and Environment File
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env.Development
          elif [ ! -f .env.Development ]; then
            touch .env.Development
          fi
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yml .env.Development \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/supportly-ai/

      - name: 🚀 Deploy via SSH
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
          IMG_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "DOCKER_USERNAME='${DOCKER_USER}' DOCKER_PASSWORD='${DOCKER_PASS}' IMAGE_NAME='${IMG_NAME}' bash" << 'ENDSSH'

            set -e

            mkdir -p /home/ubuntu/supportly-ai
            cd /home/ubuntu/supportly-ai

            if ! docker info >/dev/null 2>&1; then
              echo "🔧 Configuring Docker daemon socket permissions..."
              sudo usermod -aG docker $USER 2>/dev/null || true
              sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
            fi

            echo "🔐 Logging in to Docker Hub..."
            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            echo "📥 Pulling latest Docker images..."
            docker compose pull

            echo "🛑 Stopping old containers..."
            docker compose down || true

            echo "🚀 Starting new containers..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning old images..."
            docker image prune -af

            echo "📊 Running containers:"
            docker ps

            echo "🌐 Health check (port 9005)..."
            for i in {1..6}; do
              if curl -sf http://localhost:9005; then
                echo "✅ App is up!"
                break
              fi
              echo "Attempt $i: Waiting..."
              sleep 5
            done

            echo "✅ Deployment Successful!"

          ENDSSH

      - name: 🗑️ Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

